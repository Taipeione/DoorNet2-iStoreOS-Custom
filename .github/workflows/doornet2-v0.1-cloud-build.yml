name: DoorNet2-V0.1
run-name: "DoorNet2-V0.1 #${{ github.run_number }}"

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doornet2-v0.1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    name: DoorNet2-V0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_JOBS: 3
      BUILD_VERBOSE: s
      BUILD_OUTPUT_DIR: ${{ github.workspace }}/work/cloud-artifacts

    steps:
      - name: Check out exact repository commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Record build identity and reclaim ephemeral runner space
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=$(git rev-parse HEAD)"
            echo "ref=${GITHUB_REF}"
            echo "runner=${RUNNER_NAME} (${RUNNER_ENVIRONMENT})"
            echo "started_utc=$(date -u +%FT%TZ)"
          } | tee work/cloud-build-identity.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/powershell /usr/local/share/chromium
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"

      - name: Install OpenWrt build dependencies
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee -a work/cloud-build.log
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext \
            git ripgrep libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget curl \
            xsltproc swig time python3 python3-setuptools python3-pyelftools \
            python3-yaml python3-requests libelf-dev device-tree-compiler \
            patch perl tar gzip xz-utils zstd cpio qemu-utils qemu-user-static binfmt-support 2>&1 | tee -a work/cloud-build.log
          sudo update-binfmts --enable qemu-aarch64 2>&1 | tee -a work/cloud-build.log
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"

      - name: Check out fixed standard OpenWrt source and precheck integration
        shell: bash
        run: |
          set -o pipefail
          source config/source.env
          mkdir -p work
          git clone --filter=blob:none --no-checkout "$OPENWRT_REPOSITORY" work/openwrt
          git -C work/openwrt fetch --depth=1 origin "$OPENWRT_COMMIT"
          git -C work/openwrt checkout --detach FETCH_HEAD
          test "$(git -C work/openwrt rev-parse HEAD)" = "$OPENWRT_COMMIT"
          {
            scripts/apply-board-support.sh "$GITHUB_WORKSPACE/work/openwrt"
            scripts/verify-v0.1.sh "$GITHUB_WORKSPACE/work/openwrt"
            grep -q '^OPENWRT_VERSION=v25.12.5$' config/source.env
            grep -q '192\.168\.100\.1' configs/doorNet2-v0.1.config
            ! grep -q '192\.168\.50\.1' configs/doorNet2-v0.1.config
            git -C work/openwrt status --short
          } 2>&1 | tee -a work/cloud-build.log

      - name: Restore verified OpenWrt source-download cache
        uses: actions/cache@v4
        with:
          path: work/openwrt/dl
          key: doornet2-v0.1-openwrt-downloads-${{ runner.os }}-${{ hashFiles('config/source.env', 'config/feeds.conf') }}

      - name: Compile complete firmware and target policy integration test
        id: full_build
        shell: bash
        run: |
          set -o pipefail
          scripts/build-v0.1.sh "$GITHUB_WORKSPACE/work/openwrt" 2>&1 | tee -a work/cloud-build.log

      - name: Verify firmware images and write cloud provenance
        id: artifact_check
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-cloud-artifacts-v0.1.sh "$BUILD_OUTPUT_DIR" "$GITHUB_SHA" 2>&1 | tee -a work/cloud-build.log
          cp work/cloud-build-identity.txt "$BUILD_OUTPUT_DIR/"
          printf '%s\n' 'DoorNet2-V0.1' > "$BUILD_OUTPUT_DIR/DoorNet2-V0.1-Version.txt"
          cat > "$BUILD_OUTPUT_DIR/DoorNet2-V0.1-Test-Matrix.md" <<'EOF'
          # DoorNet2-V0.1 cloud test matrix

          | Check | Result |
          |---|---|
          | Exact GitHub-hosted runner, DoorNet2 commit, and fixed OpenWrt v25.12.5 commit | PASS |
          | Standard OpenWrt DoorNet2 RK3399 static integration precheck | PASS |
          | Complete cloud firmware build with ext4 and squashfs sysupgrade images | PASS |
          | Image gzip CRC, fwtool metadata, MBR/FIT offsets, SHA256, and required package manifest | PASS |
          | Built-rootfs firmware identity, clean-install LAN, and WeChatDirect merge policy | PASS |
          | iStore application package in built image | PASS |
          | Real DoorNet2 boot, DDR3L training, Ethernet, LuCI, and SSH | NOT TESTED |
          | PassWall, PassWall2, SmartDNS, AdGuard Home, ChinaDNS-NG lifecycle on hardware | NOT TESTED |
          | DNS, WeChatDirect routing, and OTA restore on hardware | NOT TESTED |

          No real-device flashing, eMMC write, partition change, or bootloader write was performed.
          EOF
          (
            cd "$BUILD_OUTPUT_DIR"
            sha256sum DoorNet2-V0.1-*-sysupgrade.img.gz DoorNet2-V0.1-*.manifest profiles.json DoorNet2-V0.1-BuildInfo.txt DoorNet2-V0.1-Version.txt DoorNet2-V0.1-Test-Matrix.md
          ) | tee "$BUILD_OUTPUT_DIR/DoorNet2-V0.1-SHA256SUMS"
          {
            echo "### DoorNet2-V0.1 cloud firmware build: PASS"
            echo
            echo "- Repository commit: \`$GITHUB_SHA\`"
            echo "- OpenWrt: \`v25.12.5\` / \`$(git -C work/openwrt rev-parse HEAD)\`"
            echo "- Runner: GitHub-hosted \`ubuntu-24.04\`"
            echo "- Target: \`rockchip/armv8/embedfire_doornet2\` (RK3399, 1GB DDR3L target)"
            echo "- Version: \`DoorNet2-V0.1\`; Linux \`6.12.94\`"
            echo "- Images: ext4 and squashfs sysupgrade; see artifact checksums below."
            echo
            echo '\`\`\`text'
            cat "$BUILD_OUTPUT_DIR/DoorNet2-V0.1-SHA256SUMS"
            echo '\`\`\`'
            echo
            echo 'Cloud compilation and artifact checks do not establish real-device boot, service lifecycle, DNS routing, or OTA recovery; these remain NOT TESTED.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve build logs, identity, and any generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2-V0.1-${{ github.sha }}-run-${{ github.run_number }}
          path: |
            work/cloud-build.log
            work/cloud-build-identity.txt
            work/cloud-artifacts/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Summarize failed or incomplete build
        if: always() && (steps.full_build.outcome != 'success' || steps.artifact_check.outcome != 'success')
        shell: bash
        run: |
          {
            echo '### DoorNet2-V0.1 cloud firmware build: NOT PASSED'
            echo
            echo "- Repository commit: $GITHUB_SHA"
            echo "- OpenWrt source: v25.12.5 / $(awk -F= '$1 == \"OPENWRT_COMMIT\" {print $2}' config/source.env)"
            echo "- Full build step: ${{ steps.full_build.outcome }}"
            echo "- Artifact verification step: ${{ steps.artifact_check.outcome }}"
            echo '- Build log and any partial artifacts are attached to this run. No local build substitutes for this result.'
          } >> "$GITHUB_STEP_SUMMARY"
