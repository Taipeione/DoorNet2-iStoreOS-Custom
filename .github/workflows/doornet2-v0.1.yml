name: DoorNet2-V0.1
run-name: "DoorNet2-V0.1 #${{ github.run_number }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doornet2-v0.1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    name: DoorNet2-V0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_JOBS: 3
      BUILD_VERBOSE: s
      BUILD_OUTPUT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Check out exact project commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Prepare GitHub-hosted builder
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/powershell
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git ripgrep libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget curl xsltproc swig time python3 python3-setuptools python3-pyelftools python3-yaml patch perl tar gzip xz-utils zstd cpio qemu-utils
          df -h "$GITHUB_WORKSPACE"
      - name: Check out fixed standard OpenWrt and run precheck
        shell: bash
        run: |
          set -euo pipefail
          source config/source.env
          git clone --filter=blob:none --no-checkout "$OPENWRT_REPOSITORY" work/openwrt
          git -C work/openwrt fetch --depth=1 origin "$OPENWRT_COMMIT"
          git -C work/openwrt checkout --detach FETCH_HEAD
          test "$(git -C work/openwrt rev-parse HEAD)" = "$OPENWRT_COMMIT"
          scripts/apply-board-support.sh "$GITHUB_WORKSPACE/work/openwrt"
          scripts/verify-v0.1.sh "$GITHUB_WORKSPACE/work/openwrt"
      - name: Compile complete firmware
        id: build
        shell: bash
        run: scripts/build-v0.1.sh "$GITHUB_WORKSPACE/work/openwrt" 2>&1 | tee cloud-build.log
      - name: Verify firmware images and provenance
        id: verify
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_OUTPUT_DIR"
          cp cloud-build.log "$BUILD_OUTPUT_DIR/DoorNet2-V0.1-build.log"
          echo 'Cloud build and artifact checks passed. Real-device boot, network, plugins, DNS, WeChatDirect and OTA recovery remain NOT TESTED.' > "$BUILD_OUTPUT_DIR/DoorNet2-V0.1-Test-Matrix.txt"
          scripts/verify-cloud-artifacts-v0.1.sh "$GITHUB_WORKSPACE/work/openwrt" "$BUILD_OUTPUT_DIR" "$GITHUB_SHA"
      - name: Upload logs and generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2-V0.1-${{ github.sha }}-run-${{ github.run_number }}
          path: |
            cloud-build.log
            artifacts/
          retention-days: 30
          compression-level: 0
